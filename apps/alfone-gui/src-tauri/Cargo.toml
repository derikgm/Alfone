[package]
name = "alfone-gui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Alfone desktop control panel"

# The app has its own workspace so the headless workspace can run `cargo test`
# without WebKitGTK/WebView2.
[workspace]

[lib]
name = "alfone_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
alfone-core = { path = "../../../crates/alfone-core" }
alfone-net = { path = "../../../crates/alfone-net" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
